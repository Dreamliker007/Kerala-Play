<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09061b">
<meta name="screen-orientation" content="landscape">
<title>Game Planet · Kerala Play</title>
<style>
:root{color-scheme:dark;--bg:#09061b;--panel:#15102d;--violet:#8d6bff;--cyan:#63e9ff;--gold:#ffd76c;--green:#62e89a;--red:#ff6f87}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060412;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,a{font:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 18% 22%,rgba(106,86,255,.28),transparent 28%),
radial-gradient(circle at 78% 32%,rgba(72,229,255,.16),transparent 25%),
radial-gradient(circle at 50% 110%,rgba(190,78,255,.22),transparent 40%),
linear-gradient(180deg,#080518,#0d0920 55%,#05030e)}
.stars{position:fixed;inset:0;pointer-events:none;opacity:.8;background-image:
radial-gradient(circle,#fff 0 1px,transparent 1.4px),
radial-gradient(circle,#7cecff 0 1px,transparent 1.3px);
background-size:72px 72px,113px 113px;background-position:0 0,28px 41px}
.shell{position:relative;z-index:1;height:100dvh;display:grid;grid-template-rows:auto 1fr;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.planet-logo{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#d6c8ff 0 7%,#7653d9 8% 42%,#281661 68%,#11082b);box-shadow:0 0 26px rgba(139,105,255,.65);position:relative;flex:none}
.planet-logo:after{content:"";position:absolute;left:-9px;right:-9px;top:20px;height:8px;border:2px solid #81e7ff;border-radius:50%;transform:rotate(-13deg);opacity:.82}
.brand h1{margin:0;font-size:clamp(20px,2.5vw,34px);line-height:1}.brand p{margin:3px 0 0;color:#b9b2d2;font-size:11px}
.return{height:40px;padding:0 13px;border:1px solid rgba(255,255,255,.23);border-radius:12px;background:rgba(17,12,43,.82);color:white;text-decoration:none;font-weight:900;display:flex;align-items:center}
.hub{min-height:0;display:grid;grid-template-columns:minmax(160px,22vw) 1fr;gap:10px}
.intro{border:1px solid rgba(151,126,255,.32);border-radius:20px;background:linear-gradient(180deg,rgba(25,17,56,.9),rgba(11,8,29,.92));padding:14px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.intro h2{margin:0 0 7px;font-size:clamp(16px,2vw,24px)}.intro p{margin:0;color:#bdb5d5;font-size:11px;line-height:1.45}.gate-orb{width:min(130px,70%);aspect-ratio:1;margin:10px auto;border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff 0 2%,#9fffff 3% 10%,#7148dd 32%,#211250 66%,#090516 70%);box-shadow:0 0 55px rgba(104,82,255,.42);position:relative}.gate-orb:before,.gate-orb:after{content:"";position:absolute;left:-18%;right:-18%;top:46%;height:14%;border:3px solid rgba(108,235,255,.85);border-radius:50%;transform:rotate(-12deg)}.gate-orb:after{transform:rotate(18deg);border-color:rgba(255,196,96,.55)}
.badges{display:flex;gap:5px;flex-wrap:wrap}.badge{padding:5px 7px;border-radius:999px;background:rgba(255,255,255,.07);font-size:9px;color:#ded8f0}
.catalog{min-height:0;overflow:auto;padding:2px 5px 8px 2px;display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:8px;touch-action:pan-y}
.card{border:1px solid rgba(255,255,255,.14);border-radius:17px;background:linear-gradient(160deg,rgba(31,21,67,.92),rgba(11,8,29,.96));padding:11px;text-align:left;color:white;cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.card:active{transform:scale(.988)}.card:before{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-24px;top:-28px;background:radial-gradient(circle,rgba(104,232,255,.26),transparent 70%)}.card .icon{font-size:24px}.card h3{margin:5px 0 3px;font-size:14px}.card p{margin:0;color:#bdb5d4;font-size:9px;line-height:1.35}.card .meta{margin-top:6px;color:#8cecff;font-size:8px;font-weight:900;letter-spacing:.4px}
.card.featured{border-color:rgba(255,213,104,.55);box-shadow:inset 0 0 0 1px rgba(255,213,104,.1)}
.stage{position:fixed;z-index:40;inset:0;display:none;background:radial-gradient(circle at 50% 20%,#251557,#090614 62%);padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.stage.open{display:grid;grid-template-rows:auto 1fr;gap:8px}.stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.stage-title{font-weight:1000;font-size:18px}.stage-actions{display:flex;gap:7px}.btn{min-height:36px;border:1px solid rgba(255,255,255,.2);border-radius:11px;background:#211746;color:#fff;padding:0 12px;font-weight:900;cursor:pointer}.btn.primary{background:#5b43c6;border-color:#a89aff}.btn.danger{background:#6b2637;border-color:#ff9eb0}.game{min-height:0;border:1px solid rgba(255,255,255,.13);border-radius:18px;background:rgba(6,4,18,.78);overflow:hidden;position:relative}.game-center{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:12px}.big{font-size:clamp(40px,9vw,95px);font-weight:1000}.sub{color:#bbb3d0;font-size:11px;text-align:center}.two{height:100%;display:grid;grid-template-columns:1fr 1fr}.tap-side{border:0;color:white;font-size:clamp(20px,3vw,38px);font-weight:1000;position:relative}.tap-side.a{background:linear-gradient(145deg,#126f64,#0b3b45)}.tap-side.b{background:linear-gradient(145deg,#a13b58,#4a1833)}.tap-side strong{display:block;font-size:clamp(50px,9vw,105px)}.timer-pill{position:absolute;z-index:4;left:50%;top:12px;transform:translateX(-50%);background:rgba(8,5,20,.9);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 12px;font-weight:900}.overlay-note{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(8,5,20,.94);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:13px 18px;text-align:center;font-weight:900;max-width:80%}
.grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:min(34vw,310px)}.grid16 button{aspect-ratio:1;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:#20184b;color:white;font-weight:900}.grid16 button.done{opacity:.18}.rush-wrap{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px}.rush-player{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.rush-stat{font-size:11px;color:#c9c2da}
.memory-pads{display:grid;grid-template-columns:repeat(2,minmax(80px,150px));gap:7px}.memory-pad{aspect-ratio:1;border:0;border-radius:17px;opacity:.72}.memory-pad.flash{opacity:1;box-shadow:0 0 28px currentColor;transform:scale(1.04)}.c1{background:#ff5f68}.c2{background:#52d889}.c3{background:#4b9cff}.c4{background:#ffd65c}
.clock-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(720px,90%)}.clock-btn{height:110px;border-radius:18px;border:1px solid rgba(255,255,255,.18);font-size:20px;font-weight:1000;color:white}.clock-btn:nth-child(1){background:#146e67}.clock-btn:nth-child(2){background:#8b3550}
.orb-arena,.fall-arena{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#11102d,#070716)}.player-dot{position:absolute;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);touch-action:none;box-shadow:0 0 18px currentColor}.p1{background:#69e7ff;color:#69e7ff}.p2{background:#ff7d9d;color:#ff7d9d}.orb{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);background:#8df7bd;box-shadow:0 0 15px rgba(141,247,189,.5)}.orb.gold{background:#ffd75f;box-shadow:0 0 20px rgba(255,215,95,.75)}.orb.bomb{background:#ff4f65;border-radius:6px}.scorebar{position:absolute;z-index:3;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;font-weight:900;font-size:11px;pointer-events:none}
.connect{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}.connect-grid{display:grid;grid-template-columns:repeat(7,min(8vw,64px));grid-template-rows:repeat(6,min(8vw,64px));gap:4px;background:#392c81;padding:7px;border-radius:16px}.cell{border-radius:50%;background:#0a071a;box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}.cell.r{background:#ff6477}.cell.y{background:#ffd65e}
.tilegrid{position:absolute;inset:40px 12px 12px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);gap:3px}.tile{background:#382d75;border-radius:5px;transition:opacity .3s,transform .3s}.tile.gone{opacity:.05;transform:scale(.7)}
canvas{width:100%;height:100%;display:block;touch-action:none}
.rps{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}.choices{display:flex;gap:10px}.choice{width:95px;height:95px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:#21184c;color:white;font-size:40px}
@media(max-width:820px){.hub{grid-template-columns:145px 1fr}.catalog{grid-template-columns:repeat(3,minmax(120px,1fr))}.intro{padding:10px}.card{min-height:98px;padding:8px}.card p{display:none}.card .icon{font-size:20px}.card h3{font-size:12px}.return{height:34px;font-size:10px}.planet-logo{width:36px;height:36px}.brand p{display:none}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="shell">
<header>
  <div class="brand"><div class="planet-logo"></div><div><h1>GAME PLANET</h1><p>Kerala Play · games-only world</p></div></div>
  <a class="return" href="./index.html">↩ RETURN TO KERALA</a>
</header>
<div class="hub">
  <aside class="intro">
    <div><h2>Welcome, Player</h2><p>You crossed the district portal into a separate planet made only for mini-games. Pick a game and jump in.</p></div>
    <div class="gate-orb"></div>
    <div class="badges"><span class="badge">⚡ QUICK</span><span class="badge">👥 LOCAL</span><span class="badge">🏆 WINS</span><span class="badge">🪐 PLANET</span></div>
  </aside>
  <main class="catalog" id="catalog">
    <button class="card featured" data-link="./vadamvali.html"><span class="icon">🪢</span><div><h3>Vadamvali</h3><p>Online/local tug-of-war tapping. Win by a 30-tap lead.</p><div class="meta">ONLINE · 2 PLAYERS</div></div></button>
    <button class="card" data-game="tap"><span class="icon">⚡</span><div><h3>Tap Battle</h3><p>10-second tap race. Highest score wins.</p><div class="meta">LOCAL · 2 PLAYERS</div></div></button>
    <button class="card" data-game="draw"><span class="icon">🎯</span><div><h3>Quick Draw</h3><p>Wait for green. Fastest reaction wins; early tap loses.</p><div class="meta">REACTION · 2 PLAYERS</div></div></button>
    <button class="card" data-game="rush"><span class="icon">🔢</span><div><h3>Number Rush</h3><p>Tap 1–16 in order on the same shuffled board.</p><div class="meta">SPEED · 2 PLAYERS</div></div></button>
    <button class="card" data-game="memory"><span class="icon">🧠</span><div><h3>Memory Flash</h3><p>Repeat the growing four-pad pattern.</p><div class="meta">MEMORY · TURN BASED</div></div></button>
    <button class="card" data-game="clock"><span class="icon">⏱️</span><div><h3>Stop the Clock</h3><p>Timer hides; stop nearest the target across 3 stages.</p><div class="meta">TIMING · 2 PLAYERS</div></div></button>
    <button class="card" data-game="orb"><span class="icon">🟡</span><div><h3>Orb Grab</h3><p>Drag, collect orbs, grab gold, avoid freeze bombs.</p><div class="meta">ARENA · 2 PLAYERS</div></div></button>
    <button class="card" data-game="drop"><span class="icon">🔴</span><div><h3>Drop Four</h3><p>Drop discs and connect four before your opponent.</p><div class="meta">STRATEGY · 2 PLAYERS</div></div></button>
    <button class="card" data-game="fall"><span class="icon">🧱</span><div><h3>Floor Fall</h3><p>Tiles disappear. Stay alive longer than the bots.</p><div class="meta">SURVIVAL · UP TO 6</div></div></button>
    <button class="card" data-game="hockey"><span class="icon">🏒</span><div><h3>Pocket Hockey</h3><p>Drag paddles and score 5 goals first.</p><div class="meta">SPORT · 2 PLAYERS</div></div></button>
    <button class="card" data-game="worm"><span class="icon">🐍</span><div><h3>Worm Arena</h3><p>Steer, eat food, grow and survive against bots.</p><div class="meta">ARENA · SOLO + BOTS</div></div></button>
    <button class="card" data-game="rps"><span class="icon">✊</span><div><h3>Stone Paper Scissors</h3><p>Pass-and-play best of three.</p><div class="meta">CLASSIC · 2 PLAYERS</div></div></button>
  </main>
</div>
</div>

<section class="stage" id="stage">
  <div class="stage-head">
    <div class="stage-title" id="stage-title">Game</div>
    <div class="stage-actions"><button class="btn" id="restart">↻ Restart</button><button class="btn danger" id="exit-game">✕ Planet Hub</button></div>
  </div>
  <div class="game" id="game"></div>
</section>

<script>
(function(){
var stage=document.getElementById('stage'), game=document.getElementById('game'), title=document.getElementById('stage-title');
var restart=document.getElementById('restart'), cleanup=function(){};
var activeId='';
var wins=JSON.parse(localStorage.getItem('kp-game-planet-wins')||'{}');
function saveWin(id,player){wins[id]=wins[id]||{};wins[id][player]=(wins[id][player]||0)+1;localStorage.setItem('kp-game-planet-wins',JSON.stringify(wins));}
function setCleanup(fn){cleanup();cleanup=typeof fn==='function'?fn:function(){};}
function open(id){activeId=id;stage.classList.add('open');init(id);}
function close(){setCleanup();stage.classList.remove('open');game.replaceChildren();activeId='';}
function init(id){setCleanup();game.replaceChildren();var map={tap:'Tap Battle',draw:'Quick Draw',rush:'Number Rush',memory:'Memory Flash',clock:'Stop the Clock',orb:'Orb Grab',drop:'Drop Four',fall:'Floor Fall',hockey:'Pocket Hockey',worm:'Worm Arena',rps:'Stone Paper Scissors'};title.textContent=map[id]||'Game';({tap:initTap,draw:initDraw,rush:initRush,memory:initMemory,clock:initClock,orb:initOrb,drop:initDrop,fall:initFall,hockey:initHockey,worm:initWorm,rps:initRps}[id]||function(){})();}

document.getElementById('catalog').addEventListener('click',function(e){var card=e.target.closest('.card');if(!card)return;if(card.dataset.link)location.href=card.dataset.link;else open(card.dataset.game);});
document.getElementById('exit-game').onclick=close;
restart.onclick=function(){if(activeId)init(activeId);};

function initTap(){
 game.innerHTML='<div class="timer-pill" id="tap-timer">READY</div><div class="two"><button class="tap-side a" id="ta">PLAYER 1<strong>0</strong><small>TAP FAST</small></button><button class="tap-side b" id="tb">PLAYER 2<strong>0</strong><small>TAP FAST</small></button></div><div class="overlay-note" id="tap-note">Tap START to begin a 10-second race.<br><br><button class="btn primary" id="tap-start">START</button></div>';
 var a=0,b=0,running=false,left=10,iv=null;var A=document.getElementById('ta'),B=document.getElementById('tb'),timer=document.getElementById('tap-timer'),note=document.getElementById('tap-note');
 A.onclick=function(){if(running){a++;A.querySelector('strong').textContent=a;navigator.vibrate&&navigator.vibrate(8)}};
 B.onclick=function(){if(running){b++;B.querySelector('strong').textContent=b;navigator.vibrate&&navigator.vibrate(8)}};
 document.getElementById('tap-start').onclick=function(){note.remove();running=true;var end=performance.now()+10000;iv=setInterval(function(){left=Math.max(0,(end-performance.now())/1000);timer.textContent=left.toFixed(1)+'s';if(left<=0){clearInterval(iv);running=false;var w=a===b?'DRAW':a>b?'PLAYER 1':'PLAYER 2';timer.textContent=w+' WINS';if(w!=='DRAW')saveWin('tap',w)}},50)};
 setCleanup(function(){clearInterval(iv)});
}

function initDraw(){
 game.innerHTML='<div class="two"><button class="tap-side a" id="da">PLAYER 1<strong>WAIT</strong></button><button class="tap-side b" id="db">PLAYER 2<strong>WAIT</strong></button></div><div class="overlay-note" id="draw-note">Tap START. Wait until both sides turn GREEN. Early tap loses.<br><br><button class="btn primary" id="draw-start">START</button></div>';
 var ready=false,done=false,start=0,to=null;var A=document.getElementById('da'),B=document.getElementById('db'),note=document.getElementById('draw-note');
 function hit(player,el,other){if(done)return;if(!ready){done=true;el.querySelector('strong').textContent='EARLY';other.querySelector('strong').textContent='WIN';saveWin('draw',player===1?'PLAYER 2':'PLAYER 1');return}done=true;var ms=Math.round(performance.now()-start);el.querySelector('strong').textContent=ms+'ms';other.querySelector('strong').textContent='LATE';saveWin('draw',player===1?'PLAYER 1':'PLAYER 2')}
 A.onclick=function(){hit(1,A,B)};B.onclick=function(){hit(2,B,A)};
 document.getElementById('draw-start').onclick=function(){note.remove();A.querySelector('strong').textContent='WAIT';B.querySelector('strong').textContent='WAIT';to=setTimeout(function(){ready=true;start=performance.now();A.style.background='#15905a';B.style.background='#15905a';A.querySelector('strong').textContent='TAP!';B.querySelector('strong').textContent='TAP!';navigator.vibrate&&navigator.vibrate(60)},1500+Math.random()*2800)};
 setCleanup(function(){clearTimeout(to)});
}

function initRush(){
 var nums=[];for(var i=1;i<=16;i++)nums.push(i);for(i=nums.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=nums[i];nums[i]=nums[j];nums[j]=t}
 game.innerHTML='<div class="rush-wrap"><div class="rush-player"><b>PLAYER 1</b><div class="rush-stat" id="rs1">Next: 1 · Penalty: 0s</div><div class="grid16" id="rg1"></div></div><div class="rush-player"><b>PLAYER 2</b><div class="rush-stat" id="rs2">Next: 1 · Penalty: 0s</div><div class="grid16" id="rg2"></div></div></div><div class="timer-pill" id="rush-time">0.00s</div>';
 var next=[1,1],pen=[0,0],finish=[null,null],start=performance.now(),iv=setInterval(function(){document.getElementById('rush-time').textContent=((performance.now()-start)/1000).toFixed(2)+'s'},40);
 function build(n){var box=document.getElementById('rg'+(n+1));nums.forEach(function(v){var b=document.createElement('button');b.textContent=v;b.onclick=function(){if(finish[n]!=null)return;if(v===next[n]){b.classList.add('done');b.disabled=true;next[n]++;if(next[n]===17){finish[n]=(performance.now()-start)/1000+pen[n];document.getElementById('rs'+(n+1)).textContent='FINISH '+finish[n].toFixed(2)+'s';if(finish[0]!=null&&finish[1]!=null){clearInterval(iv);var w=finish[0]===finish[1]?'DRAW':finish[0]<finish[1]?'PLAYER 1':'PLAYER 2';document.getElementById('rush-time').textContent=w+' WINS';if(w!=='DRAW')saveWin('rush',w)}}else document.getElementById('rs'+(n+1)).textContent='Next: '+next[n]+' · Penalty: '+pen[n]+'s'}else{pen[n]++;document.getElementById('rs'+(n+1)).textContent='Next: '+next[n]+' · Penalty: '+pen[n]+'s'}};box.appendChild(b)})}
 build(0);build(1);setCleanup(function(){clearInterval(iv)});
}

function initMemory(){
 var master=[];for(var i=0;i<22;i++)master.push(Math.floor(Math.random()*4));var player=0,level=1,input=0,locked=true,scores=[0,0],to=[];
 game.innerHTML='<div class="game-center"><div><b id="mem-status">PLAYER 1 · Level 1</b></div><div class="memory-pads"><button class="memory-pad c1" data-n="0"></button><button class="memory-pad c2" data-n="1"></button><button class="memory-pad c3" data-n="2"></button><button class="memory-pad c4" data-n="3"></button></div><div class="sub">Watch the pattern, then repeat it. One wrong tap ends your run.</div><button class="btn primary" id="mem-start">START PLAYER 1</button></div>';
 var pads=[].slice.call(game.querySelectorAll('.memory-pad')),status=document.getElementById('mem-status'),startBtn=document.getElementById('mem-start');
 function flash(n,delay){to.push(setTimeout(function(){pads[n].classList.add('flash');navigator.vibrate&&navigator.vibrate(15);to.push(setTimeout(function(){pads[n].classList.remove('flash')},300))},delay))}
 function show(){locked=true;input=0;status.textContent='PLAYER '+(player+1)+' · WATCH · Level '+level;var seq=master.slice(0,level+2);seq.forEach(function(n,i){flash(n,450+i*500)});to.push(setTimeout(function(){locked=false;status.textContent='PLAYER '+(player+1)+' · REPEAT '+seq.length+' STEPS'},500+seq.length*500))}
 function fail(){locked=true;scores[player]=level-1;if(player===0){player=1;level=1;startBtn.hidden=false;startBtn.textContent='START PLAYER 2';status.textContent='PLAYER 1 SCORE '+scores[0]+' · pass device'}else{var w=scores[0]===scores[1]?'DRAW':scores[0]>scores[1]?'PLAYER 1':'PLAYER 2';status.textContent=w+' WINS · '+scores[0]+'–'+scores[1];if(w!=='DRAW')saveWin('memory',w)}}
 pads.forEach(function(p){p.onclick=function(){if(locked)return;var n=Number(p.dataset.n),seq=master.slice(0,level+2);p.classList.add('flash');setTimeout(function(){p.classList.remove('flash')},120);if(n!==seq[input]){fail();return}input++;if(input===seq.length){locked=true;level++;status.textContent='CORRECT · Level '+level;to.push(setTimeout(show,650))}}});
 startBtn.onclick=function(){startBtn.hidden=true;show()};setCleanup(function(){to.forEach(clearTimeout)});
}

function initClock(){
 var targets=[3,5,7],round=0,started=0,stopped=[false,false],errors=[0,0],iv=null;
 game.innerHTML='<div class="game-center"><div class="big" id="clock-target">Target 3.0s</div><div id="clock-display">0.00s</div><div class="clock-actions"><button class="clock-btn" id="ca">PLAYER 1 · STOP</button><button class="clock-btn" id="cb">PLAYER 2 · STOP</button></div><div class="sub" id="clock-status">Timer hides after 1.5 seconds. Smallest total error after 3 stages wins.</div><button class="btn primary" id="clock-start">START ROUND</button></div>';
 var disp=document.getElementById('clock-display'),stat=document.getElementById('clock-status'),startBtn=document.getElementById('clock-start'),A=document.getElementById('ca'),B=document.getElementById('cb');

function initDrop(){

function initFall(){

 var arena=document.getElementById('fa'),grid=document.getElementById('tiles'),tiles=[],alive=Array(6).fill(true),dots=[],tick=0,iv=null,end=performance.now()+35000;
 for(var i=0;i<40;i++){var t=document.createElement('div');t.className='tile';tiles.push(t);grid.appendChild(t)}
 var colors=['#67eaff','#ff7899','#ffd65f','#72e896','#9a80ff','#ff9a62'];
 for(i=0;i<6;i++){var d=i===0?document.getElementById('human'):document.createElement('div');d.className='player-dot';d.style.background=colors[i];d.style.color=colors[i];arena.appendChild(d);d._x=50+i*45;d._y=70+(i%2)*70;placeDot(d);dots.push(d)}

 function tileIndex(d){var rr=grid.getBoundingClientRect(),ar=arena.getBoundingClientRect(),x=d._x-(rr.left-ar.left),y=d._y-(rr.top-ar.top);var col=Math.floor(x/(rr.width/8)),row=Math.floor(y/(rr.height/5));return row>=0&&row<5&&col>=0&&col<8?row*8+col:-1}

function initHockey(){
 game.innerHTML='<canvas id="hc"></canvas>';var cv=document.getElementById('hc'),ctx=cv.getContext('2d'),raf=0,last=performance.now(),score=[0,0],ptr={};function resize(){var r=cv.getBoundingClientRect();cv.width=Math.max(300,Math.floor(r.width*devicePixelRatio));cv.height=Math.max(180,Math.floor(r.height*devicePixelRatio));ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();var W=function(){return cv.clientWidth},H=function(){return cv.clientHeight};var pad=[{x:70,y:H()/2},{x:W()-70,y:H()/2}],puck={x:W()/2,y:H()/2,vx:4,vy:2.5},done=false;

 cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);var r=cv.getBoundingClientRect(),x=e.clientX-r.left;ptr[e.pointerId]=x<W()/2?0:1;move(e)});cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',function(e){delete ptr[e.pointerId]});

function initWorm(){
 game.innerHTML='<canvas id="wc"></canvas>';var cv=document.getElementById('wc'),ctx=cv.getContext('2d'),raf=0,start=performance.now(),done=false;function resize(){var r=cv.getBoundingClientRect();cv.width=Math.max(300,Math.floor(r.width*devicePixelRatio));cv.height=Math.max(180,Math.floor(r.height*devicePixelRatio));ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();var W=function(){return cv.clientWidth},H=function(){return cv.clientHeight};var food=[];for(var i=0;i<14;i++)food.push({x:20+Math.random()*(W()-40),y:20+Math.random()*(H()-40)});var worms=[];var cols=['#63e9ff','#ff718d','#ffd05e','#72e49b'];for(i=0;i<4;i++)worms.push({x:80+i*70,y:70+i*25,dx:i?Math.cos(i):1,dy:i?Math.sin(i):0,len:8,body:[],alive:true,color:cols[i]});var target={x:W()/2,y:H()/2};cv.addEventListener('pointermove',function(e){var r=cv.getBoundingClientRect();target.x=e.clientX-r.left;target.y=e.clientY-r.top});cv.addEventListener('pointerdown',function(e){var r=cv.getBoundingClientRect();target.x=e.clientX-r.left;target.y=e.clientY-r.top});
 function loop(){if(done)return;ctx.clearRect(0,0,W(),H());worms.forEach(function(w,n){if(!w.alive)return;if(n===0){var a=Math.atan2(target.y-w.y,target.x-w.x);w.dx=Math.cos(a);w.dy=Math.sin(a)}else{var near=food.reduce(function(best,f){return Math.hypot(f.x-w.x,f.y-w.y)<Math.hypot(best.x-w.x,best.y-w.y)?f:best},food[0]);var aa=Math.atan2(near.y-w.y,near.x-w.x)+(Math.random()-.5)*.12;w.dx=Math.cos(aa);w.dy=Math.sin(aa)}w.x+=w.dx*2.1;w.y+=w.dy*2.1;if(w.x<5||w.x>W()-5||w.y<5||w.y>H()-5){w.alive=false;return}w.body.unshift({x:w.x,y:w.y});while(w.body.length>w.len)w.body.pop();food.forEach(function(f){if(Math.hypot(f.x-w.x,f.y-w.y)<10){w.len+=2;f.x=20+Math.random()*(W()-40);f.y=20+Math.random()*(H()-40)}});ctx.strokeStyle=w.color;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();w.body.forEach(function(p,i){if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.stroke()});food.forEach(function(f){ctx.fillStyle='#ff4d62';ctx.beginPath();ctx.arc(f.x,f.y,5,0,Math.PI*2);ctx.fill()});var alive=worms.filter(function(w){return w.alive}),sec=Math.max(0,45-Math.floor((performance.now()-start)/1000));ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.fillText('YOU '+worms[0].len+' · '+sec+'s · '+alive.length+' alive',12,22);if(!worms[0].alive||alive.length<=1||sec<=0){done=true;var best=worms.map(function(w,i){return {i:i,len:w.len,alive:w.alive}}).sort(function(a,b){return Number(b.alive)-Number(a.alive)||b.len-a.len})[0];ctx.font='bold 28px system-ui';ctx.fillText(best.i===0?'YOU WIN':'BOT '+best.i+' WINS',W()/2-80,H()/2);if(best.i===0)saveWin('worm','PLAYER');return}raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);setCleanup(function(){done=true;cancelAnimationFrame(raf)});

function initRps(){
 var p1=null,round=1,score=[0,0],locked=false;game.innerHTML='<div class="rps"><div class="big" id="rps-status">PLAYER 1</div><div class="sub" id="rps-sub">Choose secretly, then pass the phone.</div><div class="choices"><button class="choice" data-c="rock">✊</button><button class="choice" data-c="paper">✋</button><button class="choice" data-c="scissors">✌️</button></div></div>';var st=document.getElementById('rps-status'),sub=document.getElementById('rps-sub');function outcome(a,b){if(a===b)return 0;if((a==='rock'&&b==='scissors')||(a==='paper'&&b==='rock')||(a==='scissors'&&b==='paper'))return 1;return 2}game.querySelectorAll('.choice').forEach(function(b){b.onclick=function(){if(locked)return;var c=b.dataset.c;if(!p1){p1=c;st.textContent='PLAYER 2';sub.textContent='Player 1 locked. Choose now.'}else{var o=outcome(p1,c);if(o)score[o-1]++;locked=true;st.textContent=o===0?'DRAW ROUND':'PLAYER '+o+' WINS ROUND';sub.textContent='Score '+score[0]+'–'+score[1];if(score[0]===2||score[1]===2){var w=score[0]===2?'PLAYER 1':'PLAYER 2';st.textContent=w+' WINS';saveWin('rps',w);return}setTimeout(function(){round++;p1=null;locked=false;st.textContent='PLAYER 1';sub.textContent='Round '+round+' · choose secretly.'},1000)}}})}
})();
