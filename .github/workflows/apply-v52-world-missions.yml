name: Apply Kerala Play V52

on:
  push:
    branches:
      - v52-world-missions
    paths:
      - '.v52-stage/**'
      - '.github/workflows/apply-v52-world-missions.yml'

permissions:
  contents: write

jobs:
  apply-v52:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V52 branch
        uses: actions/checkout@v4
        with:
          ref: v52-world-missions
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply V52 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v52-stage/chunk-*.b64 | base64 -d > /tmp/v52.patch.gz
          gzip -dc /tmp/v52.patch.gz > /tmp/v52.patch
          git apply --check /tmp/v52.patch
          git apply /tmp/v52.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          data = p.read_bytes()
          if data.endswith(b"\n\r\n"):
              p.write_bytes(data[:-3] + b"\n\n")
          PY

      - name: Verify V52
        run: |
          npm test
          npm run mobile:release:check

      - name: Commit V52
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v52-stage .v52-patch
          rm -f .github/workflows/apply-v52-world-missions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Kerala Play V52 World Missions"
          git push origin HEAD:v52-world-missions
