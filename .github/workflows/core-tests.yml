name: Kerala Play Core Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'virtual-world-*'

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run server tests
        run: npm test
      - name: Run Android release config check
        run: npm run mobile:release:check
