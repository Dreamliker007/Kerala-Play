name: V59 Vehicle Economy Checks

on:
  push:
    branches:
      - v59-fuel-damage-service

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check game.js
      - run: node --check social.js
      - run: node --check server.mjs
      - run: npm test
      - run: npm run mobile:release:check
