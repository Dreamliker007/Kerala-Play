<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#4a8cda">
  <title>Kerala Play — Normal Controls</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #92c9ff; font-family: Arial, sans-serif; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #brand { position: absolute; top: calc(env(safe-area-inset-top) + 14px); left: 16px; padding: 9px 12px; border-radius: 12px; color: white; background: rgba(11, 35, 45, .62); box-shadow: 0 2px 12px rgba(0,0,0,.18); font-weight: 700; letter-spacing: .2px; }
    #hint { position: absolute; top: calc(env(safe-area-inset-top) + 64px); left: 16px; color: rgba(255,255,255,.92); background: rgba(11,35,45,.46); border-radius: 10px; padding: 7px 10px; font-size: 12px; line-height: 1.35; }
    #joystick-zone { position: absolute; left: 0; bottom: 0; width: 48vw; height: 42vh; min-width: 220px; min-height: 245px; pointer-events: auto; touch-action: none; }
    #joystick-base { position: absolute; width: 118px; height: 118px; left: 30px; bottom: calc(env(safe-area-inset-bottom) + 28px); border: 2px solid rgba(255,255,255,.34); border-radius: 50%; background: rgba(10,37,42,.24); box-shadow: inset 0 0 22px rgba(0,0,0,.15); }
    #joystick-knob { position: absolute; width: 54px; height: 54px; left: 30px; top: 30px; border: 2px solid rgba(255,255,255,.55); border-radius: 50%; background: rgba(255,255,255,.28); box-shadow: 0 3px 9px rgba(0,0,0,.18); transform: translate(0,0); }
    #run { position: absolute; right: 22px; bottom: calc(env(safe-area-inset-bottom) + 38px); width: 80px; height: 80px; pointer-events: auto; touch-action: none; border: 2px solid rgba(255,255,255,.55); border-radius: 50%; color: #fff; font-weight: 800; font-size: 14px; letter-spacing: .5px; background: rgba(26,92,72,.68); box-shadow: 0 4px 15px rgba(0,0,0,.24); }
    #run.active { background: rgba(55,174,112,.9); transform: scale(.96); }
    #camera-zone { position: absolute; right: 0; bottom: 0; width: 52vw; height: 100vh; pointer-events: auto; touch-action: none; }
    #camera-note { position: absolute; right: 122px; bottom: calc(env(safe-area-inset-bottom) + 65px); color: rgba(255,255,255,.87); background: rgba(11,35,45,.42); padding: 6px 8px; border-radius: 8px; font-size: 11px; }
    #fallback { display: none; position: fixed; inset: 0; z-index: 5; place-items: center; padding: 24px; background: #16323f; color: white; text-align: center; line-height: 1.5; }
    @media (min-width: 740px) { #joystick-zone { width: 330px; height: 330px; } #joystick-base { left: 44px; bottom: 38px; } #run { right: 44px; bottom: 46px; } }
  </style>
</head>
<body>
  <div id="hud" aria-label="Game controls">
    <div id="brand">Kerala Play <span style="font-size:11px;opacity:.8">V41</span></div>
    <div id="hint">Left pad: move<br>Right side: look around<br>Hold RUN: run</div>
    <div id="joystick-zone" aria-label="Movement joystick">
      <div id="joystick-base"><div id="joystick-knob"></div></div>
    </div>
    <div id="camera-zone" aria-label="Camera look area"></div>
    <div id="camera-note">Swipe to look</div>
    <button id="run" type="button" aria-label="Hold to run">RUN</button>
  </div>
  <div id="fallback">Kerala Play could not start. Please open this page while connected to the internet, then reload.</div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.1/build/three.module.js';

    const fallback = document.querySelector('#fallback');
    const joystickZone = document.querySelector('#joystick-zone');
    const joystickBase = document.querySelector('#joystick-base');
    const joystickKnob = document.querySelector('#joystick-knob');
    const cameraZone = document.querySelector('#camera-zone');
    const runButton = document.querySelector('#run');

    try {
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = false;
      document.body.prepend(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x92c9ff);
      scene.fog = new THREE.Fog(0x92c9ff, 50, 150);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, .1, 200);
      const clock = new THREE.Clock();
      const player = new THREE.Group();
      const cameraTarget = new THREE.Vector3();
      const cameraPosition = new THREE.Vector3();
      const worldUp = new THREE.Vector3(0, 1, 0);
      const desiredMove = new THREE.Vector3();

      scene.add(player);
      buildWorld(scene);
      buildPlayer(player);

      const sun = new THREE.HemisphereLight(0xeaf7ff, 0x486231, 2.25);
      scene.add(sun);
      const warmLight = new THREE.DirectionalLight(0xfff1d0, 1.5);
      warmLight.position.set(35, 55, 25);
      scene.add(warmLight);

      let joystickPointerId = null;
      let lookPointerId = null;
      let lastLookX = 0;
      let lastLookY = 0;
      let inputX = 0;
      let inputY = 0;
      let cameraYaw = Math.PI * .75;
      let cameraPitch = .31;
      let runHeld = false;
      let walkPhase = 0;
      const keys = new Set();

      function clearJoystick() {
        joystickPointerId = null;
        inputX = 0;
        inputY = 0;
        joystickKnob.style.transform = 'translate(0px, 0px)';
      }

      function updateJoystick(event) {
        const rect = joystickBase.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const maximum = 38;
        let dx = event.clientX - centerX;
        let dy = event.clientY - centerY;
        const distance = Math.hypot(dx, dy);
        if (distance > maximum) {
          dx *= maximum / distance;
          dy *= maximum / distance;
        }
        inputX = dx / maximum;
        inputY = dy / maximum;
        joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      }

      joystickZone.addEventListener('pointerdown', event => {
        if (joystickPointerId !== null) return;
        joystickPointerId = event.pointerId;
        joystickZone.setPointerCapture(event.pointerId);
        updateJoystick(event);
        event.preventDefault();
      });
      joystickZone.addEventListener('pointermove', event => {
        if (event.pointerId === joystickPointerId) updateJoystick(event);
      });
      joystickZone.addEventListener('pointerup', event => {
        if (event.pointerId === joystickPointerId) clearJoystick();
      });
      joystickZone.addEventListener('pointercancel', event => {
        if (event.pointerId === joystickPointerId) clearJoystick();
      });
      joystickZone.addEventListener('lostpointercapture', clearJoystick);

      cameraZone.addEventListener('pointerdown', event => {
        if (lookPointerId !== null || event.target === runButton) return;
        lookPointerId = event.pointerId;
        lastLookX = event.clientX;
        lastLookY = event.clientY;
        cameraZone.setPointerCapture(event.pointerId);
      });
      cameraZone.addEventListener('pointermove', event => {
        if (event.pointerId !== lookPointerId) return;
        cameraYaw -= (event.clientX - lastLookX) * .009;
        cameraPitch = THREE.MathUtils.clamp(cameraPitch + (event.clientY - lastLookY) * .006, .12, .64);
        lastLookX = event.clientX;
        lastLookY = event.clientY;
      });
      function clearLook(event) { if (!event || event.pointerId === lookPointerId) lookPointerId = null; }
      cameraZone.addEventListener('pointerup', clearLook);
      cameraZone.addEventListener('pointercancel', clearLook);
      cameraZone.addEventListener('lostpointercapture', clearLook);

      function setRun(value) {
        runHeld = value;
        runButton.classList.toggle('active', value);
      }
      runButton.addEventListener('pointerdown', event => {
        runButton.setPointerCapture(event.pointerId);
        setRun(true);
        event.preventDefault();
      });
      runButton.addEventListener('pointerup', () => setRun(false));
      runButton.addEventListener('pointercancel', () => setRun(false));
      runButton.addEventListener('lostpointercapture', () => setRun(false));

      window.addEventListener('keydown', event => {
        keys.add(event.key.toLowerCase());
        if (event.key === 'Shift') setRun(true);
      });
      window.addEventListener('keyup', event => {
        keys.delete(event.key.toLowerCase());
        if (event.key === 'Shift') setRun(false);
      });
      window.addEventListener('blur', () => {
        keys.clear();
        clearJoystick();
        setRun(false);
        lookPointerId = null;
      });
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      renderer.domElement.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        fallback.style.display = 'grid';
        fallback.textContent = 'The game paused because WebGL was interrupted. Reload this page to continue.';
      });

      function gameLoop() {
        requestAnimationFrame(gameLoop);
        const delta = Math.min(clock.getDelta(), .05);
        const keyboardX = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
        const keyboardY = (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - (keys.has('w') || keys.has('arrowup') ? 1 : 0);
        const controlX = Math.abs(keyboardX) > 0 ? keyboardX : inputX;
        const controlY = Math.abs(keyboardY) > 0 ? keyboardY : inputY;
        const controlLength = Math.min(1, Math.hypot(controlX, controlY));

        if (controlLength > .06) {
          const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
          const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
          desiredMove.copy(forward).multiplyScalar(-controlY).addScaledVector(right, controlX).normalize();
          const speed = runHeld ? 7.2 : 3.8;
          player.position.addScaledVector(desiredMove, speed * controlLength * delta);
          player.position.x = THREE.MathUtils.clamp(player.position.x, -70, 70);
          player.position.z = THREE.MathUtils.clamp(player.position.z, -70, 70);
          const desiredYaw = Math.atan2(desiredMove.x, desiredMove.z);
          player.rotation.y = rotateTowards(player.rotation.y, desiredYaw, delta * 11);
          cameraYaw = rotateTowards(cameraYaw, player.rotation.y + Math.PI, delta * 1.4);
          walkPhase += delta * (runHeld ? 15 : 9) * controlLength;
          animatePlayer(player, walkPhase, controlLength);
        } else {
          animatePlayer(player, walkPhase, 0);
        }

        cameraTarget.set(player.position.x, player.position.y + 1.45, player.position.z);
        const distance = 7.1;
        const horizontal = Math.cos(cameraPitch) * distance;
        cameraPosition.set(
          player.position.x + Math.sin(cameraYaw) * horizontal,
          player.position.y + 1.45 + Math.sin(cameraPitch) * distance,
          player.position.z + Math.cos(cameraYaw) * horizontal
        );
        camera.position.lerp(cameraPosition, 1 - Math.exp(-delta * 9));
        camera.lookAt(cameraTarget);
        renderer.render(scene, camera);
      }
      gameLoop();
    } catch (error) {
      console.error(error);
      fallback.style.display = 'grid';
    }

    function rotateTowards(current, target, amount) {
      const turn = Math.atan2(Math.sin(target - current), Math.cos(target - current));
      return current + THREE.MathUtils.clamp(turn, -amount, amount);
    }

    function buildPlayer(player) {
      const clothes = new THREE.MeshStandardMaterial({ color: 0x236f9c, roughness: .85 });
      const skin = new THREE.MeshStandardMaterial({ color: 0xa96d4c, roughness: .9 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x1d2025, roughness: .95 });
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.34, .64, 5, 10), clothes);
      torso.position.y = 1.23;
      player.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(.27, 12, 10), skin);
      head.position.y = 1.88;
      player.add(head);
      const hair = new THREE.Mesh(new THREE.SphereGeometry(.285, 12, 8, 0, Math.PI * 2, 0, Math.PI * .52), dark);
      hair.position.y = 1.98;
      player.add(hair);
      const leftArm = new THREE.Mesh(new THREE.CapsuleGeometry(.1, .48, 4, 8), skin);
      const rightArm = leftArm.clone();
      leftArm.position.set(-.39, 1.28, 0);
      rightArm.position.set(.39, 1.28, 0);
      leftArm.rotation.z = -.11;
      rightArm.rotation.z = .11;
      leftArm.name = 'leftArm'; rightArm.name = 'rightArm';
      player.add(leftArm, rightArm);
      const leftLeg = new THREE.Mesh(new THREE.CapsuleGeometry(.13, .58, 4, 8), dark);
      const rightLeg = leftLeg.clone();
      leftLeg.position.set(-.17, .53, 0);
      rightLeg.position.set(.17, .53, 0);
      leftLeg.name = 'leftLeg'; rightLeg.name = 'rightLeg';
      player.add(leftLeg, rightLeg);
    }

    function animatePlayer(player, phase, moving) {
      const swing = moving ? Math.sin(phase) * .55 : 0;
      player.getObjectByName('leftArm').rotation.x = swing;
      player.getObjectByName('rightArm').rotation.x = -swing;
      player.getObjectByName('leftLeg').rotation.x = -swing;
      player.getObjectByName('rightLeg').rotation.x = swing;
    }

    function buildWorld(scene) {
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(160, 160),
        new THREE.MeshStandardMaterial({ color: 0x5c9650, roughness: 1 })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x41484a, roughness: .98 });
      const road = new THREE.Mesh(new THREE.PlaneGeometry(16, 160), roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.y = .012;
      scene.add(road);
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xf2dc74 });
      for (let z = -72; z <= 72; z += 9) {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(.22, 4), lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(0, .025, z);
        scene.add(line);
      }
      const sideRoad = new THREE.Mesh(new THREE.PlaneGeometry(88, 12), roadMat);
      sideRoad.rotation.x = -Math.PI / 2;
      sideRoad.position.set(-28, .01, -22);
      scene.add(sideRoad);
      addHouse(scene, -23, -34, 0xeadbc5);
      addHouse(scene, 27, 23, 0xf1d7aa);
      addHouse(scene, -35, 31, 0xc8e2df);
      addShop(scene, 18, -32);
      const treePositions = [[-14,-62],[13,-55],[-20,-47],[19,-42],[-18,-20],[17,-10],[-18,5],[18,9],[-16,34],[16,43],[-14,61],[17,66],[-50,-20],[-45,14],[-42,48],[46,-42],[42,4],[47,52]];
      treePositions.forEach(([x, z], i) => addTree(scene, x, z, 1 + (i % 3) * .08));
      addPond(scene, 39, -4);
      addBench(scene, -10, -10);
    }

    function addHouse(scene, x, z, wallColor) {
      const group = new THREE.Group();
      const walls = new THREE.Mesh(new THREE.BoxGeometry(8, 4.5, 7), new THREE.MeshStandardMaterial({ color: wallColor, roughness: .9 }));
      walls.position.y = 2.25;
      group.add(walls);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(6.2, 2.7, 4), new THREE.MeshStandardMaterial({ color: 0x9e4c36, roughness: .95 }));
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 5.85;
      group.add(roof);
      const door = new THREE.Mesh(new THREE.BoxGeometry(1.25, 2.25, .12), new THREE.MeshStandardMaterial({ color: 0x60412d }));
      door.position.set(0, 1.15, 3.56);
      group.add(door);
      group.position.set(x, 0, z);
      scene.add(group);
    }

    function addShop(scene, x, z) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(9, 3.5, 5.5), new THREE.MeshStandardMaterial({ color: 0xefe8d3, roughness: .9 }));
      body.position.y = 1.75;
      const awning = new THREE.Mesh(new THREE.BoxGeometry(10, .45, 1.6), new THREE.MeshStandardMaterial({ color: 0xbf3835, roughness: .9 }));
      awning.position.set(0, 3.1, 3.1);
      const sign = new THREE.Mesh(new THREE.BoxGeometry(5, .8, .1), new THREE.MeshBasicMaterial({ color: 0x285d90 }));
      sign.position.set(0, 3.8, 2.78);
      group.add(body, awning, sign);
      group.position.set(x, 0, z);
      scene.add(group);
    }

    function addTree(scene, x, z, scale) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.28, .42, 3.1, 7), new THREE.MeshStandardMaterial({ color: 0x6c482c, roughness: 1 }));
      trunk.position.y = 1.55;
      const leaves = new THREE.Mesh(new THREE.SphereGeometry(2.1, 10, 8), new THREE.MeshStandardMaterial({ color: 0x2e762f, roughness: 1 }));
      leaves.position.y = 4.25;
      const topLeaves = new THREE.Mesh(new THREE.SphereGeometry(1.45, 9, 7), new THREE.MeshStandardMaterial({ color: 0x398b37, roughness: 1 }));
      topLeaves.position.set(.2, 5.45, -.15);
      group.add(trunk, leaves, topLeaves);
      group.position.set(x, 0, z);
      group.scale.setScalar(scale);
      scene.add(group);
    }

    function addPond(scene, x, z) {
      const pond = new THREE.Mesh(new THREE.CircleGeometry(9, 32), new THREE.MeshStandardMaterial({ color: 0x2f94b6, roughness: .35, metalness: .05 }));
      pond.rotation.x = -Math.PI / 2;
      pond.position.set(x, .018, z);
      scene.add(pond);
    }

    function addBench(scene, x, z) {
      const group = new THREE.Group();
      const wood = new THREE.MeshStandardMaterial({ color: 0x74462e, roughness: .9 });
      const seat = new THREE.Mesh(new THREE.BoxGeometry(2.7, .16, .55), wood);
      seat.position.y = .7;
      const back = new THREE.Mesh(new THREE.BoxGeometry(2.7, .75, .14), wood);
      back.position.set(0, 1.15, .24);
      group.add(seat, back);
      group.position.set(x, 0, z);
      scene.add(group);
    }
  </script>
</body>
</html>
