<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kerala Play - Ludo</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f8;color:#17202a}
.top{position:sticky;top:0;z-index:10;background:#fff;box-shadow:0 2px 12px #0002;padding:14px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:800}.logo span{color:#087f5b}
.back{color:#087f5b;text-decoration:none;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:28px 16px 50px}
h1{text-align:center;margin:8px 0}.sub{text-align:center;color:#68737d}
.game-area{display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:24px}
.board{width:min(90vw,600px);aspect-ratio:1;background:#fff;border:8px solid #17202a;border-radius:18px;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);overflow:hidden;box-shadow:0 10px 30px #0002}
.cell{border:1px solid #dfe4e7;position:relative;background:#fff}
.red{background:#ffdddd}.green{background:#dff7e8}.yellow{background:#fff4c9}.blue{background:#dfeaff}
.track{background:#fff}.safe{background:#e9f7f2}
.center{background:conic-gradient(#e74c3c 0 25%,#f1c40f 25% 50%,#2ecc71 50% 75%,#3498db 75% 100%)}
.token{width:72%;height:72%;border-radius:50%;position:absolute;left:14%;top:14%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(9px,2vw,14px);font-weight:800;border:2px solid #fff;box-shadow:0 2px 5px #0005;cursor:pointer;z-index:3}
.t-red{background:#e74c3c}.t-green{background:#16a085}.t-yellow{background:#e0a800}.t-blue{background:#2980b9}
.panel{width:min(90vw,320px);background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 25px #0002}
.turn{font-size:20px;font-weight:800;margin-bottom:12px}
.dice{font-size:64px;text-align:center;margin:10px 0}
.roll{width:100%;font-size:18px}
.info{margin-top:16px;line-height:1.6;color:#5d6770}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.player{padding:10px;border-radius:10px;font-weight:700}
.p0{background:#ffe0e0}.p1{background:#ddf7ea}.p2{background:#fff1bd}.p3{background:#dce9ff}
.status{margin-top:14px;padding:10px;border-radius:10px;background:#f1f3f5;font-size:14px}
@media(max-width:650px){.wrap{padding-top:16px}.board{border-width:5px}.panel{width:min(90vw,600px)}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">Kerala <span>Play</span></div>
  <a class="back" href="index.html#games">← Games</a>
</header>

<div class="wrap">
<h1>🎲 Ludo</h1>
<p class="sub">2–4 players • Local pass-and-play</p>

<div class="game-area">
  <div id="board" class="board" aria-label="Ludo board"></div>

  <div class="panel">
    <div id="turn" class="turn">Red's turn</div>
    <div id="dice" class="dice">⚀</div>
    <button id="roll" class="roll">Roll Dice</button>
    <div id="status" class="status">Roll the dice. A 6 brings a token out of home.</div>
    <div class="players">
      <div class="player p0">🔴 Red</div>
      <div class="player p1">🟢 Green</div>
      <div class="player p2">🟡 Yellow</div>
      <div class="player p3">🔵 Blue</div>
    </div>
    <button id="reset" style="width:100%;margin-top:12px;background:#17202a">New Game</button>
  </div>
</div>
</div>

<script>
const path=[
[6,1],[6,2],[6,3],[6,4],[6,5],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],
[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[6,9],[6,10],[6,11],[6,12],
[6,13],[6,14],[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],
[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[14,7],[14,6],[13,6],[12,6],
[11,6],[10,6],[9,6],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],[7,0],[6,0]
];

const starts=[0,13,26,39];
const colors=['red','green','yellow','blue'];
const names=['Red','Green','Yellow','Blue'];
const diceFace=['⚀','⚁','⚂','⚃','⚄','⚅'];
let players=4, current=0, rollValue=0, extra=false, winner=null;
let tokens=Array.from({length:players},()=>[-1,-1,-1,-1]);

const board=document.getElementById('board');
const turn=document.getElementById('turn');
const dice=document.getElementById('dice');
const rollBtn=document.getElementById('roll');
const statusEl=document.getElementById('status');
const resetBtn=document.getElementById('reset');

function key(r,c){return r+'-'+c}
function buildBoard(){
  board.innerHTML='';
  for(let r=0;r<15;r++)for(let c=0;c<15;c++){
    const cell=document.createElement('div'); cell.className='cell';
    if(r<6&&c<6)cell.classList.add('red');
    if(r<6&&c>8)cell.classList.add('green');
    if(r>8&&c<6)cell.classList.add('blue');
    if(r>8&&c>8)cell.classList.add('yellow');
    if((r===6||r===8)&&c>=6&&c<=8 || (c===6||c===8)&&r>=6&&r<=8)cell.classList.add('track');
    if(r>=6&&r<=8&&c>=6&&c<=8)cell.classList.add('center');
    cell.id='c-'+key(r,c);
    board.appendChild(cell);
  }
  renderTokens();
}
function renderTokens(){
  document.querySelectorAll('.token').forEach(x=>x.remove());
  tokens.forEach((arr,p)=>{
    arr.forEach((pos,t)=>{
      let coord;
      if(pos===-1){
        const home=[[2,2],[2,3],[3,2],[3,3],[2,11],[2,12],[3,11],[3,12],
                    [11,2],[11,3],[12,2],[12,3],[11,11],[11,12],[12,11],[12,12]];
        coord=home[p*4+t];
      }else if(pos>=0&&pos<52) coord=path[(starts[p]+pos)%52];
      else coord=path[(starts[p]+51)%52];
      const cell=document.getElementById('c-'+key(coord[0],coord[1]));
      if(!cell)return;
      const el=document.createElement('div');
      el.className='token t-'+colors[p]; el.textContent=t+1;
      el.title=names[p]+' token '+(t+1);
      el.onclick=()=>moveToken(p,t);
      cell.appendChild(el);
    });
  });
}
function canMove(p,t){
  const pos=tokens[p][t];
  if(pos===57)return false;
  if(pos===-1)return rollValue===6;
  return pos+rollValue<=57;
}
function moveToken(p,t){
  if(winner!==null || p!==current || !rollValue || !canMove(p,t)){
    return;
  }
  let pos=tokens[p][t];
  tokens[p][t]=(pos===-1)?0:pos+rollValue;
  const landed=tokens[p][t];
  if(landed<52){
    const global=(starts[p]+landed)%52;
    tokens.forEach((arr,op)=>{
      if(op===p)return;
      arr.forEach((v,ot)=>{
        if(v>=0&&v<52&&((starts[op]+v)%52)===global) tokens[op][ot]=-1;
      });
    });
  }
  const won=tokens[p].every(v=>v===57);
  renderTokens();
  if(won){winner=p;turn.textContent=names[p]+' wins! 🎉';statusEl.textContent='Congratulations! Start a new game to play again.';rollBtn.disabled=true;return}
  const keep=rollValue===6;
  rollValue=0; dice.textContent='⚀';
  if(keep){statusEl.textContent=names[p]+' rolled a 6 — roll again!';}
  else nextPlayer();
}
function nextPlayer(){
  current=(current+1)%players;
  turn.textContent=names[current]+"'s turn";
  statusEl.textContent='Roll the dice.';
  rollBtn.disabled=false;
}
rollBtn.onclick=()=>{
  if(winner!==null)return;
  rollValue=Math.floor(Math.random()*6)+1;
  dice.textContent=diceFace[rollValue-1];
  const moves=tokens[current].map((_,t)=>canMove(current,t)).some(Boolean);
  if(!moves){
    statusEl.textContent=rollValue===6?'No movable token. Roll again.':'No valid move. Turn passes.';
    const keep=rollValue===6;
    rollValue=0;
    if(keep)setTimeout(()=>{dice.textContent='⚀';statusEl.textContent='Roll again.'},700);
    else setTimeout(nextPlayer,700);
  }else{
    statusEl.textContent='Choose a highlighted/movable token by clicking it.';
    rollBtn.disabled=true;
  }
};
resetBtn.onclick=()=>{
  tokens=Array.from({length:players},()=>[-1,-1,-1,-1]);
  current=0;rollValue=0;winner=null;dice.textContent='⚀';
  turn.textContent="Red's turn";statusEl.textContent='Roll the dice.';
  rollBtn.disabled=false;buildBoard();
};
buildBoard();
</script>
</body>
</html>
